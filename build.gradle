plugins {
	id 'fabric-loom' version '1.10.5'
}

version = "1.4.0beta"
group = "com.thrt.mtrdriver"

base {
	archivesName = "MinecraftTransitDriver"
}

tasks.named('remapJar') {
	archiveFileName = '[MinecraftTransitDriver]1.20.4fabric_1.4.0beta.jar'
}

repositories {
	maven {
		name = "Tencent Fabric"
		url = "https://mirrors.cloud.tencent.com/fabric/"
	}
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:1.20.4"
	mappings "net.fabricmc:yarn:1.20.4+build.3:v2"

	modImplementation "net.fabricmc:fabric-loader:0.15.11"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.97.3+1.20.4"

	modImplementation files('libs/MTR-fabric-4.0.5+1.20.4.jar')
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}
